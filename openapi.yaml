openapi: 3.0.3
info:
  title: Dinas WMS — API (MVP)
  version: 0.1.0
  description: >
    Contrato mínimo para el MVP de la App de Vendedores.
    Fuente de verdad de la comunicación entre la App (iOS) y el Middleware (.NET).
    NINGÚN cambio a este contrato sin aprobación del Arquitecto (ver CLAUDE.md de coordinación).

    Alcance del MVP:
      - Autenticación por usuario/contraseña (JWT).
      - Sincronización de BAJADA: catálogo, precios, stock/disponible, clientes.
      - Sincronización de SUBIDA: órdenes tomadas (con idempotencia por UUID de dispositivo).

    Fuera del MVP (NO incluir todavía): pagos, créditos, visitas, gastos,
    promociones, cartera, picking, facturación a SAP.

servers:
  - url: https://api.dinas-wms.example.com/v1
    description: Middleware (nube). El path base es /v1.

tags:
  - name: auth
    description: Autenticación de usuarios del sistema.
  - name: sync-down
    description: Datos que la app descarga (deltas desde un timestamp).
  - name: sync-up
    description: Transacciones que la app envía al middleware.

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Login por usuario y contraseña
      security: []   # endpoint público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync/catalog:
    get:
      tags: [sync-down]
      summary: Descarga incremental del catálogo de ítems
      description: >
        Devuelve los ítems creados o modificados desde 'since'.
        Si 'since' se omite, devuelve el catálogo completo (primera sincronización).
        El campo 'available' viene YA CALCULADO por el middleware (stock - comprometido).
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: Lista de ítems (delta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time:
                    type: string
                    format: date-time
                    description: Timestamp del servidor; úsalo como 'since' en la próxima llamada.
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync/clients:
    get:
      tags: [sync-down]
      summary: Descarga incremental de clientes asignados al vendedor
      description: >
        Solo los clientes ASIGNADOS al vendedor autenticado.
        El vendedor se identifica por el token (no se pasa como parámetro).
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: Lista de clientes (delta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time:
                    type: string
                    format: date-time
                  clients:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders:
    post:
      tags: [sync-up]
      summary: Enviar una orden tomada por el vendedor
      description: >
        Idempotente por 'client_uuid'. Si el middleware ya recibió una orden con ese
        UUID, responde 200 con la orden existente (no crea duplicado). Órdenes nuevas → 201.
        En el MVP la orden queda registrada en el middleware; NO se integra a SAP todavía.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Orden creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAccepted'
        '200':
          description: Orden ya existente (reintento idempotente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Since:
      name: since
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Devuelve solo registros modificados a partir de este instante (ISO 8601).

  responses:
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Petición inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT de acceso.
        salesperson_code:
          type: string
          description: Código de vendedor asociado al usuario.
        display_name:
          type: string

    CatalogItem:
      type: object
      required: [item_code, name, available]
      properties:
        item_code:
          type: string
        name:
          type: string
        category:
          type: string
        barcode:
          type: string
        comments:
          type: string
        price:
          type: number
          format: double
          description: Precio de la lista asignada al vendedor.
        stock:
          type: number
          format: double
          description: Stock físico en SAP (informativo).
        available:
          type: number
          format: double
          description: Disponible YA CALCULADO por el middleware (stock - comprometido).
        image_url:
          type: string
          description: URL de la imagen (descarga diferida; no viaja en el delta).
        active:
          type: boolean
          description: Si false, la app no lo muestra ni permite ordenarlo.

    Client:
      type: object
      required: [client_code, name]
      properties:
        client_code:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string
        zipcode:
          type: string
        manager_name:
          type: string
        shipping_route:
          type: string

    OrderCreate:
      type: object
      required: [client_uuid, client_code, lines]
      properties:
        client_uuid:
          type: string
          format: uuid
          description: UUID generado en el DISPOSITIVO. Clave de idempotencia.
        client_code:
          type: string
        taken_at:
          type: string
          format: date-time
          description: Momento en que el vendedor confirmó la orden (offline).
        notes:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'

    OrderLine:
      type: object
      required: [item_code, quantity, unit_price]
      properties:
        item_code:
          type: string
        quantity:
          type: number
          format: double
          minimum: 0
        unit_price:
          type: number
          format: double
        line_discount_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Descuento de línea (%). El descuento global NO entra en el MVP.
        price_list:
          type: string
          description: Lista de precios usada para esta línea.

    OrderAccepted:
      type: object
      properties:
        client_uuid:
          type: string
          format: uuid
        order_number:
          type: string
          description: Número interno asignado por el middleware.
        status:
          type: string
          enum: [SINCRONIZADA]
          description: Estado inicial en el middleware (ver máquina de estados del diseño).
        received_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

security:
  - bearerAuth: []
