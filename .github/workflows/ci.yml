name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Un solo run por rama/PR: cancela el anterior si llega un push nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (host macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      # Cachea el build de SPM (incluye GRDB resuelto) según Package.resolved.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run tests
        run: swift test

  strict-concurrency:
    name: strict concurrency (nuestro código)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Compila con chequeo completo de concurrencia y FALLA si hay warnings en
      # nuestro código (los de GRDB, en otra ruta, no cuentan). Red de seguridad
      # contra data races antes de migrar a Swift 6.
      - name: Build con -strict-concurrency=complete
        run: |
          set -o pipefail
          swift build --build-tests -Xswiftc -strict-concurrency=complete 2>&1 | tee strict.log
          if grep -E '/(DinasSales|DinasSalesTests)/.*\.swift.*warning:' strict.log; then
            echo "::error::Warnings de concurrencia en el código de la app (arriba)."
            exit 1
          fi

  build-ios:
    name: build app (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      # Compila el target de app usando el .xcodeproj versionado (GRDB vía SPM).
      # Simulador → sin firma. Solo verifica que la app compila.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project DinasSales.xcodeproj \
            -scheme DinasSales \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
