openapi: 3.0.3
info:
  title: Dinas WMS — API
  version: 0.3.0
  description: >
    Contrato de la API del middleware Dinas WMS.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.3.0 (aprobados por el Arquitecto) — CAMBIO MAYOR
    ══════════════════════════════════════════════════════════════════════════

    1) REGLA DE PRECIO — CORREGIDA (¡lee esto con atención!)

       La regla anterior ("precio null = no ordenable") queda ANULADA.
       Regla definitiva, basada en cómo funciona SAP y la operación de Dinas:

         · SAP guarda los precios no configurados como 0 (no NULL).
         · El flag SellItem de SAP determina si un ítem se vende.
         · Un ítem a $0 SÍ ES ORDENABLE (muestras, material publicitario,
           promociones — Dinas los "ordena" aunque no los cobre).

       ┌────────────────────────┬──────────────────────────────────────────┐
       │ SellItem = 'N'         │ NO llega a la app (filtrado en la vista) │
       │ SellItem='Y' + precio  │ Ordenable al precio normal               │
       │ SellItem='Y' + $0      │ ORDENABLE A $0 + flag has_price=false    │
       └────────────────────────┴──────────────────────────────────────────┘

       · `price` YA NO ES NULLABLE. Siempre viene un número (puede ser 0).
       · `has_price` es INFORMATIVO: permite al Dashboard resaltar los ítems
         sin precio configurado, pero NO bloquea la venta.
       · La app NO debe impedir ordenar un ítem a $0.

    2) TRES LISTAS DE PRECIOS (1, 2, 3)

       Cada ítem trae sus precios en las 3 listas. La app los baja todos para
       poder cambiar de lista OFFLINE.
       (Los ListNum 1/2/3 son los códigos reales. Los NOMBRES en SAP están
        corridos y se ignoran.)

    3) LISTAS AUTORIZADAS POR CLIENTE

       Cada cliente tiene:
         · una lista POR DEFECTO (de SAP: OCRD.ListNum), y
         · opcionalmente UNA lista adicional autorizada (dato del MIDDLEWARE,
           configurada por el admin desde el Dashboard).

       El vendedor puede elegir, POR LÍNEA, cualquiera de las listas
       autorizadas para ese cliente. NO requiere aprobación posterior:
       la autorización ya ocurrió sobre el cliente.

       → NO hay estado de retención por lista de precios.

    4) NUEVO ENDPOINT ADMIN: autorizar lista adicional por cliente.

    ══════════════════════════════════════════════════════════════════════════
    Alcance vigente
      · Auth con roles (VENDEDOR | ADMIN).
      · Sync de bajada (catálogo con 3 precios, clientes con listas autorizadas).
      · Sync de subida de órdenes (idempotente, con lista de precios por línea).
      · Consulta administrativa (órdenes, catálogo, clientes) — solo lectura.
      · Gestión de la lista adicional autorizada por cliente.

    Fuera de alcance (NO implementar): pagos, créditos, visitas, gastos,
    promociones, cartera, picking, Deliveries, facturación a SAP.

servers:
  - url: https://api.dinas-wms.example.com/v1
    description: Middleware. El path base es /v1.

tags:
  - name: auth
  - name: sync-down
  - name: sync-up
  - name: admin

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Login por usuario y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sync/catalog:
    get:
      tags: [sync-down]
      summary: Catálogo con los 3 precios (vendedor)
      description: >
        Ítems creados o modificados desde 'since'. Requiere rol VENDEDOR.

        Solo llegan ítems con SellItem='Y' en SAP (los 'N' se filtran en origen).

        Cada ítem trae sus precios en las 3 listas. Un precio de 0 es VÁLIDO y
        el ítem ES ORDENABLE (muestra / publicidad / promoción).
        `available` viene YA CALCULADO por el middleware (stock - comprometido).
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: Lista de ítems (delta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sync/clients:
    get:
      tags: [sync-down]
      summary: Clientes asignados al vendedor, con sus listas autorizadas
      description: >
        Solo los clientes ASIGNADOS al vendedor del token.
        Cada cliente incluye `authorized_price_lists`: las listas que el
        vendedor puede usar con ese cliente (la de SAP + la adicional, si el
        admin la autorizó).
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: Lista de clientes (delta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  clients:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders:
    post:
      tags: [sync-up]
      summary: Enviar una orden tomada por el vendedor
      description: >
        Idempotente por 'client_uuid'. UUID ya registrado → 200 con la orden
        existente (sin duplicar). UUID nuevo → 201.

        Cada línea lleva `price_list` (1, 2 o 3): la lista que el vendedor
        eligió PARA ESA LÍNEA. El middleware DEBE validar que sea una de las
        listas autorizadas para ese cliente → si no, 400.

        `unit_price = 0` y `line_discount_pct = 100` son VÁLIDOS.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Orden creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAccepted' }
        '200':
          description: Orden ya existente (reintento idempotente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/orders:
    get:
      tags: [admin]
      summary: Grilla de órdenes recibidas
      description: REQUIERE rol ADMIN.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: salesperson_code
          in: query
          schema: { type: string }
        - name: client_code
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página de órdenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/orders/{client_uuid}:
    get:
      tags: [admin]
      summary: Detalle de una orden con sus líneas
      description: REQUIERE rol ADMIN.
      parameters:
        - name: client_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Orden con detalle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/catalog:
    get:
      tags: [admin]
      summary: Catálogo completo con los 3 precios
      description: >
        REQUIERE rol ADMIN. Incluye los ítems a $0 (con `has_price_*: false`),
        para que el administrador pueda detectarlos y decidir si les falta
        precio o si son muestras/publicidad.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: { type: string }
        - name: only_without_price
          in: query
          schema: { type: boolean, default: false }
          description: >
            Si true, devuelve SOLO los ítems sin precio en ninguna lista.
            Atajo para que el admin los revise.
      responses:
        '200':
          description: Página de ítems
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  without_price_count:
                    type: integer
                    description: >
                      Cuántos ítems (del total, no de la página) no tienen precio
                      en ninguna lista. Para que el Dashboard lo muestre como aviso.
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCatalogItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/clients:
    get:
      tags: [admin]
      summary: Todos los clientes, con sus listas autorizadas
      description: REQUIERE rol ADMIN.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página de clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  clients:
                    type: array
                    items: { $ref: '#/components/schemas/AdminClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/clients/{client_code}/price-list:
    put:
      tags: [admin]
      summary: Autorizar (o quitar) la lista de precios adicional de un cliente
      description: >
        REQUIERE rol ADMIN.

        Cada cliente tiene su lista POR DEFECTO (de SAP, inmutable desde aquí)
        y puede tener UNA lista adicional autorizada.

        Enviar `additional_price_list: null` quita la autorización.
        La lista adicional debe ser distinta de la por defecto (si no → 400).

        Este dato vive en el MIDDLEWARE, no en SAP.
      parameters:
        - name: client_code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [additional_price_list]
              properties:
                additional_price_list:
                  type: integer
                  enum: [1, 2, 3]
                  nullable: true
                  description: >
                    Lista adicional autorizada. `null` quita la autorización.
                    Debe ser distinta de la lista por defecto del cliente.
      responses:
        '200':
          description: Autorización actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminClient' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Since:
      name: since
      in: query
      required: false
      schema: { type: string, format: date-time }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Token válido pero el rol no tiene permiso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Petición inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Role:
      type: string
      enum: [VENDEDOR, ADMIN]

    OrderStatus:
      type: string
      enum: [SINCRONIZADA]
      description: >
        La máquina de estados completa (RETENIDA_CARTERA, EN_RUTA, FACTURADA...)
        llega en versiones posteriores.

    PriceListNumber:
      type: integer
      enum: [1, 2, 3]
      description: >
        Número de lista de precios (ListNum real de SAP).
        Los NOMBRES de las listas en SAP están corridos y se ignoran.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [token, role]
      properties:
        token: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        salesperson_code:
          type: string
          nullable: true
          description: Presente solo si role=VENDEDOR.
        display_name: { type: string }

    CatalogItem:
      type: object
      required: [item_code, name, available, price_list_1, price_list_2, price_list_3]
      properties:
        item_code: { type: string }
        name: { type: string }
        category: { type: string }
        barcode: { type: string }

        # ── PRECIOS: los 3, NO nullable. 0 es válido y ORDENABLE. ──
        price_list_1:
          type: number
          format: double
          description: Precio en la lista 1. 0 = sin precio configurado, pero ORDENABLE.
        price_list_2:
          type: number
          format: double
        price_list_3:
          type: number
          format: double

        # ── FLAGS INFORMATIVOS (no bloquean la venta) ──
        has_price_1:
          type: boolean
          description: >
            false si el precio en esa lista es 0 (sin configurar).
            INFORMATIVO: la app NO debe impedir ordenar por esto.
        has_price_2: { type: boolean }
        has_price_3: { type: boolean }

        stock:
          type: number
          format: double
        available:
          type: number
          format: double
          description: Calculado por el middleware (stock - comprometido).
        image_url: { type: string }
        active:
          type: boolean
          description: Si false, la app no lo muestra.

    Client:
      type: object
      required: [client_code, name, default_price_list, authorized_price_lists]
      properties:
        client_code: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        zipcode: { type: string }
        manager_name: { type: string }
        shipping_route: { type: string }

        default_price_list:
          $ref: '#/components/schemas/PriceListNumber'
        authorized_price_lists:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/PriceListNumber' }
          description: >
            Listas que el vendedor PUEDE usar con este cliente.
            Siempre incluye la `default_price_list`. Si el admin autorizó una
            lista adicional, también la incluye (máximo 2).
            La app debe permitir elegir SOLO entre estas.

    OrderCreate:
      type: object
      required: [client_uuid, client_code, lines]
      properties:
        client_uuid:
          type: string
          format: uuid
          description: UUID generado en el DISPOSITIVO. Clave de idempotencia.
        client_code: { type: string }
        taken_at: { type: string, format: date-time }
        notes: { type: string }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderLine' }

    OrderLine:
      type: object
      required: [item_code, quantity, unit_price, price_list]
      properties:
        item_code: { type: string }
        quantity:
          type: number
          format: double
          minimum: 0
        unit_price:
          type: number
          format: double
          minimum: 0
          description: >
            Precio unitario aplicado. CERO ES VÁLIDO (muestra / promoción).
        price_list:
          $ref: '#/components/schemas/PriceListNumber'
          # OBLIGATORIO desde v0.3.0: qué lista eligió el vendedor PARA ESTA LÍNEA.
          # El middleware valida que esté entre las autorizadas del cliente.
        line_discount_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Descuento de línea (%). 100 ES VÁLIDO.

    OrderAccepted:
      type: object
      properties:
        client_uuid: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        received_at: { type: string, format: date-time }

    OrderSummary:
      type: object
      properties:
        client_uuid: { type: string, format: uuid }
        order_number: { type: string }
        salesperson_code: { type: string }
        client_code: { type: string }
        client_name: { type: string }
        taken_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        line_count: { type: integer }
        total_amount:
          type: number
          format: double
        status: { $ref: '#/components/schemas/OrderStatus' }
        notes: { type: string }

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/OrderDetailLine' }

    OrderDetailLine:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        quantity: { type: number, format: double }
        unit_price: { type: number, format: double }
        price_list:
          $ref: '#/components/schemas/PriceListNumber'
        line_discount_pct: { type: number, format: double }
        line_total:
          type: number
          format: double
          description: >
            Total tras descuento, calculado por el middleware.
            Puede ser 0 (muestra o promoción) — es VÁLIDO, no un error.

    AdminCatalogItem:
      type: object
      properties:
        item_code: { type: string }
        name: { type: string }
        category: { type: string }
        barcode: { type: string }
        price_list_1: { type: number, format: double }
        price_list_2: { type: number, format: double }
        price_list_3: { type: number, format: double }
        has_price_1: { type: boolean }
        has_price_2: { type: boolean }
        has_price_3: { type: boolean }
        no_price_any_list:
          type: boolean
          description: >
            true si el ítem está a 0 en las 3 listas. El Dashboard debe
            RESALTARLO: puede ser una muestra legítima, o un producto al que
            se le olvidó configurar el precio.
        stock: { type: number, format: double }
        committed: { type: number, format: double }
        available: { type: number, format: double }
        active: { type: boolean }

    AdminClient:
      type: object
      properties:
        client_code: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        zipcode: { type: string }
        manager_name: { type: string }
        shipping_route: { type: string }
        salesperson_code: { type: string }
        default_price_list:
          $ref: '#/components/schemas/PriceListNumber'
          # Viene de SAP (OCRD.ListNum). NO se puede cambiar desde el Dashboard.
        additional_price_list:
          type: integer
          enum: [1, 2, 3]
          nullable: true
          description: >
            Lista adicional autorizada por el admin. null = ninguna.
            Vive en el MIDDLEWARE, no en SAP.
        authorized_price_lists:
          type: array
          items: { $ref: '#/components/schemas/PriceListNumber' }
          description: default_price_list + additional_price_list (si existe).

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

security:
  - bearerAuth: []
